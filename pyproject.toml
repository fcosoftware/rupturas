[project]
name = "giassi-ruptura"
version = "1.0.0"
description = "Processador de planilha de ruptura Giassi"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
]

[project.scripts]
giassi = "backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
